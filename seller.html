<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satıcı Paneli</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Satıcı Paneli</h2>

        <!-- Şifre Değiştirme Alanı -->
        <details>
            <summary>Şifremi Değiştir</summary>
            <form id="change-pass-form">
                <input type="password" id="new-password" placeholder="Yeni Şifre" required>
                <button type="submit">Şifreyi Güncelle</button>
            </form>
        </details>

        <hr>

        <!-- Ürün Ekleme -->
        <h3>Ürün Ekle</h3>
        <form id="add-product-form">
            <select id="product-category" required>
                <option value="">Kategori Seçin</option>
                <option value="meyve-sebze">Meyve & Sebze</option>
                <option value="sut-urunleri">Süt Ürünleri</option>
                <option value="firin">Fırın</option>
                <option value="atistirmalik">Atıştırmalık</option>
            </select>
            <input type="text" id="product-title" placeholder="Ürün Adı" required>
            <input type="number" id="product-price" placeholder="Fiyat (TL)" step="0.01" required>
            <input type="text" id="product-img" placeholder="Görsel URL">
            <button type="submit">Ürünü Kaydet</button>
        </form>

        <hr>

        <!-- Gelen Siparişler -->
        <h3>Gelen Siparişler</h3>
        <div id="orders-list"></div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';

        // Şifre Güncelleme
        document.getElementById('change-pass-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const { error } = await supabase.auth.updateUser({ password: newPassword });
            if (error) alert('Hata: ' + error.message);
            else alert('Şifreniz başarıyla değiştirildi.');
        });
    </script>
</body>
</html>
