name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Elle tetiklemek için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoriyi Çek
        uses: actions/checkout@v3

      - name: Node.js Kurulumu
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bağımlılıkları Yükle
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mahalle Market" "com.mahallemarket.app" --web-dir .
          npx cap add android
          npx cap sync

      - name: Android APK Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını İndirilebilir (Artifact) Olarak Yükle
        uses: actions/upload-artifact@v3
        with:
          name: MahalleMarket-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
