name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoriyi Çek
        uses: actions/checkout@v4

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Web Dosyalarını Hazırla ve Capacitor Kur
        run: |
          mkdir -p www
          cp -r index.html seller.html admin.html js css www/ 2>/dev/null || cp -r index.html seller.html admin.html js www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Mahalle Market" "com.mahallemarket.app" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Gradle Yetkisi Ver ve APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: MahalleMarket-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
